name: Build ESP32 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          arduino-cli lib install OneWire
          arduino-cli lib install "DallasTemperature"

      - name: Prepare sketch folder
        run: |
          mkdir -p esp32-ds18b20-thermometer
          cp esp32_ds18b20_thermometer.ino esp32-ds18b20-thermometer/esp32-ds18b20-thermometer.ino

      - name: Compile sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 esp32-ds18b20-thermometer --output-dir build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: build/*.bin
